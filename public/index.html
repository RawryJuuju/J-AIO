<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>JuujuTools</title>
<script>
/* theme bootstrap: apply the saved theme before first paint to avoid a flash */
try {
  var __t = localStorage.getItem('jaio_theme');
  if (__t === 'light' || __t === 'night') document.documentElement.setAttribute('data-theme', __t);
} catch (e) {}
</script>
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock">
  <div class="box">
    <div class="mark" aria-hidden="true">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    </div>
    <h1>J<span>-AIO</span></h1>
    <p>Local NFT minting suite</p>
    <label class="f" for="mpw" style="text-align:left">Master password</label>
    <div class="pwrap">
      <input id="mpw" type="password" placeholder="••••••••" autocomplete="current-password" aria-label="Master password" autofocus>
      <button class="eye" id="eyeBtn" type="button" aria-label="Show password" title="Show password">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
      </button>
    </div>
    <div class="slot" id="lockErr" role="alert" aria-live="polite"></div>
    <button class="btn pri wide" id="unlockBtn">Unlock</button>
    <div class="hint" id="lockHint">Loading…</div>
  </div>
</div>

<div id="app">
  <header>
    <button class="btn ghost sm ico" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="logo"><img class="lg" src="logo.webp" alt="Juuju" aria-hidden="true"><span>J</span><span>-AIO</span></div>
    <div class="hstat" title="Event stream"><span class="dot" id="sseDot"></span><span>stream</span></div>
    <div class="hstat opt" title="Live gas — pick a chain"><select id="hChain" class="hchain" aria-label="Gas chain"></select><span class="k">gwei</span><b id="hGwei">—</b></div>
    <div class="hstat opt"><span class="k">eth</span><b id="hEth">—</b></div>
    <div class="hstat opt" title="Local time — mint windows are announced in UTC, this is your WIB clock"><span class="k">wib</span><b id="hClock" class="mono">—</b></div>
    <button class="btn sm ghost" id="gasCalcBtn" title="Gas Profit Calculator">Gas Calc</button>
    <div class="spacer"></div>
    <button class="btn sm danger" id="panicBtn" aria-disabled="true" data-gated="1" title="No active runs">Stop All</button>
    <button class="btn sm ghost" id="lockBtn">Lock</button>
  </header>

  <div id="navScrim"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="toasts"></div>
<div class="mod" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="box" id="modalBox" tabindex="-1"></div></div>

<script src="js/core.js"></script>

<script src="js/wallets.js"></script>
<script src="js/quick.js"></script>
<script src="js/mint.js"></script>
<script src="js/war.js"></script>
<script src="js/tasks.js"></script>

<script src="js/nft.js"></script>
<script src="js/nftview.js"></script>
<script src="js/sniper.js"></script>
<script src="js/wl.js"></script>
<script src="js/accounts.js"></script>
<script src="js/deleg.js"></script>
<script src="js/social.js"></script>
<script src="js/infra.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
